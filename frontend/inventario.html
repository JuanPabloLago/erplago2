<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - ERP Lago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .table-hover tbody tr.table-active,
        .table-hover tbody tr.table-active:hover {
            background-color: #cfe2ff;
            cursor: pointer;
        }
        .stock-input {
            width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-clipboard-data-fill"></i> Gestión de Inventario</h1>
            <div>
                <button class="btn btn-danger me-2" id="btnPonerACero" title="Pone en cero el stock de todos los productos visibles en la búsqueda actual">
                    <i class="bi bi-eraser"></i> Poner a Cero Visibles
                </button>
                <button class="btn btn-outline-primary" id="btnModoEdicion">
                    <i class="bi bi-keyboard"></i> Edición Rápida con Teclado
                </button>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar por fragmentos de Producto o SKU (Enter para SKU exacto)...">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>SKU</th>
                                <th>Producto</th>
                                <th>Stock Mínimo</th>
                                <th>Stock Actual</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaInventarioBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) { window.location.href = '/login.html'; return; }

            const API_URL = '/api/inventario';
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

            const tablaBody = document.getElementById('tablaInventarioBody');
            const buscador = document.getElementById('buscador');
            const btnModoEdicion = document.getElementById('btnModoEdicion');
            const btnPonerACero = document.getElementById('btnPonerACero');
            
            let allInventario = [];
            let inventarioFiltrado = [];
            let selectedIndex = -1;
            let isEditMode = false;

            const cargarInventario = async () => {
                try {
                    const response = await fetch(`${API_URL}/completo`, { headers });
                    if (!response.ok) throw new Error('No se pudo cargar el inventario.');
                    allInventario = await response.json();
                    // Mantiene el filtro actual después de recargar
                    const textoBuscador = buscador.value;
                    buscarProductos();
                    buscador.value = textoBuscador;
                } catch (error) {
                    console.error('Error al cargar inventario:', error);
                    alert('No se pudo cargar el inventario.');
                }
            };
            
            const renderizarTabla = (inventario) => {
                tablaBody.innerHTML = '';
                selectedIndex = -1;
                if (inventario.length === 0) {
                    tablaBody.innerHTML = '<tr><td colspan="5" class="text-center">No hay productos en el inventario.</td></tr>';
                    return;
                }
                inventario.forEach(item => {
                    const tr = document.createElement('tr');
                    const stockClass = item.stock_real <= item.stock_minimo && item.stock_real > 0 ? 'table-warning' : item.stock_real <= 0 ? 'table-danger' : '';
                    tr.className = stockClass;
                    tr.innerHTML = `
                        <td>${item.sku}</td>
                        <td>${item.nombre}</td>
                        <td>${item.stock_minimo}</td>
                        <td class="stock-cell" data-stock="${item.stock_real}"><strong>${item.stock_real}</strong></td>
                        <td>
                            <button class="btn btn-sm btn-info btn-ajuste" data-id="${item.id_producto}" data-nombre="${item.nombre}" data-stock="${item.stock_real}">
                                <i class="bi bi-pencil"></i> Ajustar
                            </button>
                        </td>
                    `;
                    tablaBody.appendChild(tr);
                });
            };

            const toggleEditMode = () => {
                isEditMode = !isEditMode;
                btnModoEdicion.classList.toggle('active', isEditMode);
                btnModoEdicion.classList.toggle('btn-primary', isEditMode);
                btnModoEdicion.classList.toggle('btn-outline-primary', !isEditMode);
                if (!isEditMode) {
                    renderizarTabla(inventarioFiltrado); // Volver al estado normal
                } else {
                    buscador.focus();
                }
            };
            btnModoEdicion.addEventListener('click', toggleEditMode);

            const buscarProductos = () => {
                const textoBuscado = buscador.value.toLowerCase().trim();
                const terminos = textoBuscado.split(' ').filter(t => t.length > 0);
                if (terminos.length === 0) {
                    inventarioFiltrado = [...allInventario];
                } else {
                    inventarioFiltrado = allInventario.filter(item => {
                        const textoCompletoItem = [item.sku, item.nombre].join(' ').toLowerCase();
                        return terminos.every(termino => textoCompletoItem.includes(termino));
                    });
                }
                renderizarTabla(inventarioFiltrado);
            };
            buscador.addEventListener('keyup', (e) => {
                // Evitamos que la búsqueda se active con las flechas de navegación
                if (e.key !== "ArrowUp" && e.key !== "ArrowDown" && e.key !== "Enter") {
                    buscarProductos();
                }
            });


            buscador.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const skuExacto = buscador.value.trim();
                    const productoEncontrado = allInventario.find(p => p.sku.toLowerCase() === skuExacto.toLowerCase());
                    if (productoEncontrado) {
                        inventarioFiltrado = [productoEncontrado];
                        renderizarTabla(inventarioFiltrado);
                        if (isEditMode) {
                            selectedIndex = 0;
                            updateSelection();
                            makeCellEditable(tablaBody.querySelector('tr'));
                        }
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (!isEditMode || document.activeElement.tagName === 'INPUT') return;
                const rows = tablaBody.querySelectorAll('tr');
                if (rows.length === 0 || (rows.length === 1 && rows[0].children.length === 1)) return;

                let newIndex = selectedIndex;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    newIndex = (selectedIndex + 1) % rows.length;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    newIndex = (selectedIndex - 1 + rows.length) % rows.length;
                }
                
                if (newIndex !== selectedIndex) {
                    selectedIndex = newIndex;
                    updateSelection();
                }
            });

            const updateSelection = () => {
                const rows = tablaBody.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    if (index === selectedIndex) {
                        row.classList.add('table-active');
                        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        row.classList.remove('table-active');
                    }
                });
            };

            const makeCellEditable = (row) => {
                if (!row) return;
                // Primero, restauramos cualquier otra celda que estuviera en edición
                const otherEditableCell = tablaBody.querySelector('input.stock-input');
                if(otherEditableCell) {
                    const parentCell = otherEditableCell.closest('.stock-cell');
                    parentCell.innerHTML = `<strong>${parentCell.dataset.stock}</strong>`;
                }

                const stockCell = row.querySelector('.stock-cell');
                if (stockCell.querySelector('input')) return; 

                const stockActual = stockCell.dataset.stock;
                stockCell.innerHTML = `<input type="number" class="form-control form-control-sm stock-input" value="${stockActual}">`;
                const input = stockCell.querySelector('input');
                input.focus();
                input.select();
            };

            tablaBody.addEventListener('click', (e) => {
                if (isEditMode) {
                    const row = e.target.closest('tr');
                    if (row) {
                        selectedIndex = Array.from(tablaBody.children).indexOf(row);
                        updateSelection();
                        makeCellEditable(row);
                    }
                }
            });

            const handleNavigationAndSave = async (input, move) => {
                const row = input.closest('tr');
                const id_producto = inventarioFiltrado[Array.from(tablaBody.children).indexOf(row)].id_producto;
                const nuevo_stock = parseInt(input.value, 10);

                if (isNaN(nuevo_stock) || nuevo_stock < 0) {
                    alert('Por favor, ingrese un número válido.');
                    input.value = row.querySelector('.stock-cell').dataset.stock; // Revertir
                    return;
                }
                
                try {
                    await guardarAjuste(id_producto, nuevo_stock);
                    
                    // Actualizar el valor en la data local para no recargar toda la tabla
                    inventarioFiltrado[selectedIndex].stock_real = nuevo_stock;
                    allInventario.find(p => p.id_producto === id_producto).stock_real = nuevo_stock;

                    let newIndex = selectedIndex;
                    if(move === 'down') newIndex = (selectedIndex + 1) % inventarioFiltrado.length;
                    if(move === 'up') newIndex = (selectedIndex - 1 + inventarioFiltrado.length) % inventarioFiltrado.length;
                    
                    renderizarTabla(inventarioFiltrado);

                    setTimeout(() => {
                        selectedIndex = newIndex;
                        updateSelection();
                        const nextRow = tablaBody.querySelectorAll('tr')[selectedIndex];
                        if(nextRow) makeCellEditable(nextRow);
                    }, 50);

                } catch (error) {
                    alert('No se pudo guardar el cambio.');
                }
            };
            
            tablaBody.addEventListener('keydown', async (e) => {
                if (!e.target.classList.contains('stock-input')) return;
                
                if (e.key === 'Enter' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    handleNavigationAndSave(e.target, 'down');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    handleNavigationAndSave(e.target, 'up');
                }
            });

            btnPonerACero.addEventListener('click', async () => {
                if (inventarioFiltrado.length === 0) {
                    alert('No hay productos en la vista actual para poner a cero.');
                    return;
                }
                if (confirm(`¿Estás seguro de que quieres poner a cero el stock de los ${inventarioFiltrado.length} productos visibles? Esta acción no se puede deshacer.`)) {
                    btnPonerACero.disabled = true;
                    btnPonerACero.innerHTML = '<i class="bi bi-hourglass-split"></i> Procesando...';
                    try {
                        const promesas = inventarioFiltrado.map(item => guardarAjuste(item.id_producto, 0));
                        await Promise.all(promesas);
                        await cargarInventario();
                        alert('Stock actualizado a cero para los productos visibles.');
                    } catch (error) {
                        console.error('Error al poner a cero el stock:', error);
                        alert('Ocurrió un error al intentar actualizar el stock.');
                    } finally {
                        btnPonerACero.disabled = false;
                        btnPonerACero.innerHTML = '<i class="bi bi-eraser"></i> Poner a Cero Visibles';
                    }
                }
            });

            const guardarAjuste = async (id_producto, nuevo_stock) => {
                const response = await fetch(`${API_URL}/ajuste`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({ id_producto, nuevo_stock })
                });
                if (!response.ok) throw new Error('Fallo al guardar el ajuste.');
            };
            
            cargarInventario();
        });
    </script>
    <script src="js/connection-indicator.js"></script>
</body>
</html>
