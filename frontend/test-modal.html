<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <button onclick="abrirModal()">TEST MODAL</button>
    
    <div class="modal" id="testModal" style="display: none; position: fixed; top: 100px; left: 100px; width: 800px; height: 600px; background: white; border: 5px solid red; z-index: 9999;">
        <h1>TEST MODAL</h1>
        <div id="contenido" style="padding: 20px; background: yellow;">
            <p>Si ves esto, el modal funciona</p>
        </div>
    </div>

    <script>
    function abrirModal() {
        document.getElementById('testModal').style.display = 'block';
    }
    </script>
</body>
</html>
