<!DOCTYPE html>
<html lang="es">
<head>
<script src="js/config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Lista Proveedor — ERP LAGO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/erp-lago-styles.css">
<style>
:root {
    --lago-900:#064e32;--lago-800:#0a5c3b;--lago-700:#0d6b45;--lago-600:#10854f;--lago-500:#15a35e;
    --lago-400:#48c78e;--lago-300:#7edcb0;--lago-200:#b5edcf;--lago-100:#d9f5e8;--lago-50:#edf9f3;
    --text-primary:#1a1a1a;--text-secondary:#555;--text-muted:#888;
    --bg-page:#f4f6f5;--bg-card:#fff;--border:#dde3df;--border-focus:var(--lago-500);
    --danger:#dc3545;--warning:#e89b0c;--success:#0d6b45;
}
*{box-sizing:border-box}
body{background:var(--bg-page);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text-primary);margin:0;padding:0 0 28px 0}
.lago-navbar{background:var(--lago-700);padding:0 1rem;height:44px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.lago-navbar .brand{color:#fff;font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px}
.lago-navbar .nav-actions{display:flex;gap:4px}
.lago-navbar .nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:4px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:4px}
.lago-navbar .nav-btn:hover{background:rgba(255,255,255,.25)}
.content-area{padding:12px;max-width:1400px;margin:0 auto}
.lago-card{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;margin-bottom:10px}
.lago-card-header{background:var(--lago-50);padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:.8rem;color:var(--lago-800);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.lago-card-body{padding:10px 12px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form-group{flex:1;min-width:150px}
.form-group label{display:block;font-size:.7rem;font-weight:600;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.form-group select,.form-group input[type="file"]{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:.85rem;background:#fff}
.form-group select:focus{border-color:var(--border-focus);outline:none;box-shadow:0 0 0 2px rgba(21,163,94,.12)}
.btn-lago{background:var(--lago-600);color:#fff;border:none;padding:6px 16px;border-radius:4px;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-lago:hover{background:var(--lago-700)}
.btn-lago:disabled{opacity:.5;cursor:not-allowed}
.btn-lago-outline{background:transparent;color:var(--lago-700);border:1px solid var(--lago-500);padding:6px 16px;border-radius:4px;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-lago-outline:hover{background:var(--lago-50)}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:6px 16px;border-radius:4px;font-size:.82rem;font-weight:600;cursor:pointer}
.metric-cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.metric{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:10px 14px;flex:1;min-width:120px;text-align:center}
.metric .value{font-size:1.4rem;font-weight:700;color:var(--lago-700)}
.metric .label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
.metric.warning .value{color:var(--warning)}
.metric.danger .value{color:var(--danger)}
.metric.success .value{color:var(--success)}
.preview-table{width:100%;border-collapse:collapse;font-size:.8rem}
.preview-table th{background:var(--lago-50);padding:6px 8px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;color:var(--lago-800);border-bottom:2px solid var(--border);position:sticky;top:0}
.preview-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
.preview-table tr:hover{background:#fafafa}
.preview-table tr.row-cambio td{background:#fff8e1}
.preview-table tr.row-sin-cambio td{opacity:.6}
.preview-table tr.row-no-encontrado td{background:#fce4ec}
.badge-cambio{background:#e8f5e9;color:#2e7d32;padding:2px 6px;border-radius:3px;font-size:.7rem;font-weight:600}
.badge-sin-cambio{background:#f5f5f5;color:#999;padding:2px 6px;border-radius:3px;font-size:.7rem}
.badge-no-encontrado{background:#fce4ec;color:#c62828;padding:2px 6px;border-radius:3px;font-size:.7rem;font-weight:600}
.variacion-pos{color:var(--danger);font-weight:600}
.variacion-neg{color:var(--success);font-weight:600}
.table-scroll{max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:4px}
.step{display:none}.step.active{display:block}
.steps-indicator{display:flex;gap:0;margin-bottom:12px}
.step-pill{flex:1;padding:8px 12px;text-align:center;font-size:.78rem;font-weight:600;background:#e8e8e8;color:var(--text-muted);border:none}
.step-pill:first-child{border-radius:4px 0 0 4px}
.step-pill:last-child{border-radius:0 4px 4px 0}
.step-pill.active{background:var(--lago-600);color:#fff}
.step-pill.done{background:var(--lago-100);color:var(--lago-800)}
.checkbox-recalc{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--lago-50);border:1px solid var(--lago-200);border-radius:4px;margin-top:8px}
.checkbox-recalc input{width:16px;height:16px;accent-color:var(--lago-600)}
.checkbox-recalc label{font-size:.82rem;font-weight:500;cursor:pointer}
.resultado-box{padding:16px;border-radius:6px;text-align:center;margin-top:10px}
.resultado-box.ok{background:#e8f5e9;border:1px solid #a5d6a7}
.resultado-box.error{background:#fce4ec;border:1px solid #ef9a9a}
.resultado-box h3{margin:0 0 6px;font-size:1.1rem}
.resultado-box p{margin:2px 0;font-size:.85rem;color:var(--text-secondary)}
.historial-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.82rem}
.historial-item:last-child{border-bottom:none}
.loading{display:none;align-items:center;gap:8px;padding:12px;color:var(--text-muted);font-size:.85rem}
.loading.visible{display:flex}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--lago-600);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="lago-navbar" data-erp-header>
    <div class="brand"><i class="bi bi-upload"></i> Importar Lista Proveedor</div>
    <div class="nav-actions">
        <button class="nav-btn" onclick="mostrarHistorial()"><i class="bi bi-clock-history"></i> Historial</button>
        <button class="nav-btn" onclick="location.href='admin-listas-precios.html'"><i class="bi bi-tags"></i> Listas</button>
    </div>
</nav>

<div class="content-area">
    <!-- Steps indicator -->
    <div class="steps-indicator">
        <div class="step-pill active" id="pill-1">1. Seleccionar</div>
        <div class="step-pill" id="pill-2">2. Preview</div>
        <div class="step-pill" id="pill-3">3. Resultado</div>
    </div>

    <!-- STEP 1: Seleccionar proveedor + archivo -->
    <div class="step active" id="step-1">
        <div class="lago-card">
            <div class="lago-card-header"><i class="bi bi-cloud-upload"></i> Cargar lista de proveedor</div>
            <div class="lago-card-body">
                <div class="form-row">
                    <div class="form-group" style="flex:2">
                        <label>Proveedor</label>
                        <select id="selProveedor">
                            <option value="">— Seleccionar proveedor —</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Descuento general</label>
                        <input type="number" id="descuentoGeneral" min="0" max="100" step="0.5" style="font-weight:600" value="0" onchange="guardarDescuento()">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Productos vinculados</label>
                        <input type="text" id="prodsVinculados" readonly style="background:#f5f5f5" value="—">
                    </div>
                </div>
                <div class="form-row" style="margin-top:8px">
                    <div class="form-group" style="flex:2">
                        <label>Archivo Excel (.xlsx, .xls, .csv)</label>
                        <input type="file" id="inputArchivo" accept=".xlsx,.xls,.csv" disabled>
                    </div>
                    <div class="form-group" style="flex:0 0 auto;display:flex;align-items:end">
                        <button class="btn-lago" id="btnSubir" disabled onclick="subirArchivo()">
                            <i class="bi bi-upload"></i> Analizar
                        </button>
                    </div>
                </div>
                <div class="loading" id="loadingUpload"><div class="spinner"></div> Analizando archivo...</div>
            </div>
        </div>

        <!-- Historial reciente -->
        <div class="lago-card" id="cardHistorial" style="display:none">
            <div class="lago-card-header"><i class="bi bi-clock-history"></i> Últimas importaciones</div>
            <div class="lago-card-body" id="historialContainer"></div>
        </div>
    </div>

    <!-- STEP 2: Preview -->
    <div class="step" id="step-2">
        <div class="metric-cards" id="metricsPreview"></div>
        <div class="lago-card">
            <div class="lago-card-header">
                <span><i class="bi bi-table"></i> Preview — <span id="previewArchivo"></span></span>
                <div style="display:flex;gap:6px">
                    <button class="btn-lago-outline" onclick="irPaso(1)"><i class="bi bi-arrow-left"></i> Volver</button>
                    <button class="btn-lago" id="btnAplicar" onclick="aplicarImportacion()"><i class="bi bi-check-lg"></i> Aplicar importación</button>
                </div>
            </div>
            <div class="lago-card-body">
                <div class="checkbox-recalc">
                    <input type="checkbox" id="chkRecalcular" checked>
                    <label for="chkRecalcular">Recalcular listas de precio después de importar (recomendado)</label>
                </div>
                <div style="margin-top:8px">
                    <div style="display:flex;gap:6px;margin-bottom:6px">
                        <button class="btn-lago-outline" style="font-size:.72rem;padding:3px 8px" onclick="filtrarPreview('todos')">Todos</button>
                        <button class="btn-lago-outline" style="font-size:.72rem;padding:3px 8px" onclick="filtrarPreview('cambio')">Con cambio</button>
                        <button class="btn-lago-outline" style="font-size:.72rem;padding:3px 8px" onclick="filtrarPreview('no_encontrado')">No encontrados</button>
                    </div>
                    <div class="table-scroll">
                        <table class="preview-table">
                            <thead>
                                <tr>
                                    <th>Código prov.</th>
                                    <th>SKU</th>
                                    <th>Producto</th>
                                    <th style="text-align:right">Precio ant.</th>
                                    <th style="text-align:right">Precio nuevo</th>
                                    <th style="text-align:right">Dto %</th>
                                    <th style="text-align:right">Neto ant.</th>
                                    <th style="text-align:right">Neto nuevo</th>
                                    <th style="text-align:right">Var %</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyPreview"></tbody>
                        </table>
                    </div>
                </div>
                <div class="loading" id="loadingAplicar"><div class="spinner"></div> Aplicando importación...</div>
            </div>
        </div>
    </div>

    <!-- STEP 3: Resultado -->
    <div class="step" id="step-3">
        <div id="resultadoContainer"></div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
            <button class="btn-lago" onclick="irPaso(1)"><i class="bi bi-arrow-left"></i> Nueva importación</button>
            <button class="btn-lago-outline" onclick="mostrarHistorial()"><i class="bi bi-clock-history"></i> Ver historial</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/importacion-precios.js"></script>
</body>
</html>
