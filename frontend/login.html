<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP LAGO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .alert-warning {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <h1 class="text-center mb-4">🏪 ERP LAGO</h1>
        <form id="form-login">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" placeholder="usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btn-login">Ingresar</button>
            <div id="mensaje-error" class="alert alert-danger mt-3" style="display:none;"></div>
            <div id="mensaje-dispositivo" class="alert alert-warning mt-3" style="display:none;">
                <strong>⚠️ Dispositivo no autorizado</strong><br>
                <small>Este dispositivo no está registrado. Se ha enviado una solicitud al administrador para su autorización.</small>
            </div>
        </form>
    </div>
    <script>
        // Generar fingerprint del dispositivo
        function generarFingerprint() {
            const datos = {
                userAgent: navigator.userAgent,
                idioma: navigator.language,
                plataforma: navigator.platform,
                zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
                resolucion: `${screen.width}x${screen.height}`,
                profundidadColor: screen.colorDepth,
                memoria: navigator.deviceMemory || 'unknown',
                nucleos: navigator.hardwareConcurrency || 'unknown',
                touchscreen: 'ontouchstart' in window,
                webgl: obtenerWebGL()
            };
            
            // Crear hash simple del fingerprint
            const str = JSON.stringify(datos);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            return {
                fingerprint: Math.abs(hash).toString(36) + '-' + btoa(datos.userAgent.slice(0, 20)).slice(0, 10),
                datos: {
                    navegador: obtenerNavegador(),
                    sistema: obtenerSistema(),
                    resolucion: datos.resolucion
                }
            };
        }
        
        function obtenerWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {}
            return 'unknown';
        }
        
        function obtenerNavegador() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Edge')) return 'Edge';
            if (ua.includes('Opera')) return 'Opera';
            return 'Otro';
        }
        
        function obtenerSistema() {
            const ua = navigator.userAgent;
            if (ua.includes('Windows')) return 'Windows';
            if (ua.includes('Mac')) return 'macOS';
            if (ua.includes('Linux')) return 'Linux';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iOS') || ua.includes('iPhone')) return 'iOS';
            return 'Otro';
        }
        
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnLogin = document.getElementById('btn-login');
            const msgError = document.getElementById('mensaje-error');
            const msgDispositivo = document.getElementById('mensaje-dispositivo');
            
            btnLogin.disabled = true;
            btnLogin.textContent = 'Ingresando...';
            msgError.style.display = 'none';
            msgDispositivo.style.display = 'none';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Generar fingerprint
            const { fingerprint, datos } = generarFingerprint();
            
            try {
                const res = await fetch('/api/usuarios/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        fingerprint,
                        fingerprintDatos: datos
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    localStorage.setItem('deviceFingerprint', fingerprint);
                    window.location.href = '/venta-rapida.html';
                } else if (data.codigo === 'DISPOSITIVO_NO_AUTORIZADO') {
                    msgDispositivo.style.display = 'block';
                } else if (data.codigo === 'DISPOSITIVO_DESACTIVADO') {
                    msgError.innerHTML = '<strong>Dispositivo desactivado</strong><br>Contacte al administrador.';
                    msgError.style.display = 'block';
                } else {
                    msgError.textContent = data.error || 'Error al iniciar sesión';
                    msgError.style.display = 'block';
                }
            } catch (error) {
                msgError.textContent = 'Error de conexión: ' + error.message;
                msgError.style.display = 'block';
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Ingresar';
            }
        });
        
        // Si ya hay token VÁLIDO, verificar antes de redirigir
        const savedToken = localStorage.getItem('authToken');
        if (savedToken) {
            fetch((window.CONFIG?.API_BASE_URL || '/api') + '/auth/perfil', {
                headers: { 'Authorization': 'Bearer ' + savedToken },
                credentials: 'include'
            }).then(r => {
                if (r.ok) window.location.href = '/venta-rapida.html';
                else { localStorage.removeItem('authToken'); localStorage.removeItem('usuario'); }
            }).catch(() => { localStorage.removeItem('authToken'); localStorage.removeItem('usuario'); });
        }
    </script>
</body>
</html>
