<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Corriente - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .saldo-positivo { color: #28a745; font-weight: bold; }
        .saldo-negativo { color: #dc3545; font-weight: bold; }
        .pedido-pendiente { background-color: #fff3cd; }
        .card-resumen { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-shop"></i> ERP LAGO
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cuenta-corriente.html">Cuenta Corriente</a></li>
                    <li class="nav-item"><a class="nav-link" href="cobranzas.html">Cobranzas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-3">
            <div class="col">
                <h2><i class="bi bi-calculator"></i> Cuenta Corriente de Clientes</h2>
            </div>
        </div>

        <!-- Selector de Cliente -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Buscar Cliente</label>
                        <input type="text" id="buscarCliente" class="form-control" 
                               placeholder="Buscar por nombre, CUIT o email...">
                        <div id="resultadosBusqueda" class="list-group mt-2"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Filtrar por Fechas</label>
                        <div class="row">
                            <div class="col">
                                <input type="date" id="fechaDesde" class="form-control">
                            </div>
                            <div class="col">
                                <input type="date" id="fechaHasta" class="form-control">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary" onclick="aplicarFiltros()">
                                    <i class="bi bi-funnel"></i> Filtrar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resumen del Cliente -->
        <div id="resumenCliente" class="row mb-4" style="display: none;">
            <div class="col-md-4">
                <div class="card card-resumen">
                    <div class="card-body">
                        <h6 class="text-muted">Saldo Actual</h6>
                        <h3 id="saldoActual" class="saldo-negativo">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h6 class="text-muted">Límite de Crédito</h6>
                        <h3 id="limiteCredito">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h6 class="text-muted">Pedidos Pendientes</h6>
                        <h3 id="pedidosPendientes">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Datos del Cliente Seleccionado -->
        <div id="datosCliente" class="alert alert-info" style="display: none;">
            <strong><i class="bi bi-person"></i> <span id="nombreCliente"></span></strong><br>
            <small>CUIT: <span id="cuitCliente"></span></small>
        </div>

        <!-- Tabs: Pedidos Pendientes / Movimientos -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pedidos-tab" data-bs-toggle="tab" 
                        data-bs-target="#pedidos" type="button">
                    <i class="bi bi-cart"></i> Pedidos Pendientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="movimientos-tab" data-bs-toggle="tab" 
                        data-bs-target="#movimientos" type="button">
                    <i class="bi bi-list-ul"></i> Movimientos
                </button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-3" id="myTabContent">
            <!-- Tab Pedidos Pendientes -->
            <div class="tab-pane fade show active" id="pedidos">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th class="text-end">Total</th>
                                <th class="text-end">Pagado</th>
                                <th class="text-end">Saldo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPedidos">
                            <tr><td colspan="6" class="text-center">Seleccione un cliente</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tab Movimientos -->
            <div class="tab-pane fade" id="movimientos">
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Tipo</th>
                                <th>Concepto</th>
                                <th class="text-end">Debe</th>
                                <th class="text-end">Haber</th>
                                <th class="text-end">Saldo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMovimientos">
                            <tr><td colspan="6" class="text-center">Seleccione un cliente</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div id="botonesAccion" class="mt-3" style="display: none;">
            <button class="btn btn-success" onclick="irACobranzas()">
                <i class="bi bi-cash-coin"></i> Cobrar Pedidos
            </button>
            <button class="btn btn-info" onclick="exportarExcel()">
                <i class="bi bi-file-excel"></i> Exportar a Excel
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = window.location.hostname === 'localhost' ? 
            'http://localhost:3000' : 'http://72.60.148.18:3000';
        
        let clienteSeleccionado = null;
        let timeoutBusqueda = null;

        const token = localStorage.getItem('authToken');
        if (!token) window.location.href = 'login.html';

        document.getElementById('buscarCliente').addEventListener('input', function(e) {
            clearTimeout(timeoutBusqueda);
            const termino = e.target.value.trim();
            
            if (termino.length < 2) {
                document.getElementById('resultadosBusqueda').innerHTML = '';
                return;
            }

            timeoutBusqueda = setTimeout(() => buscarClientes(termino), 300);
        });

        async function buscarClientes(termino) {
            try {
                const response = await fetch(`${API_URL}/api/clientes/buscar?q=${encodeURIComponent(termino)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Error al buscar');

                const clientes = await response.json();
                mostrarResultadosBusqueda(clientes);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function mostrarResultadosBusqueda(clientes) {
            const div = document.getElementById('resultadosBusqueda');
            
            if (clientes.length === 0) {
                div.innerHTML = '<div class="list-group-item">No se encontraron clientes</div>';
                return;
            }

            div.innerHTML = clientes.map(c => `
                <a href="#" class="list-group-item list-group-item-action" 
                   onclick="seleccionarCliente(${c.id_cliente}, '${c.razon_social}', '${c.cuit || ''}'); return false;">
                    <strong>${c.razon_social}</strong><br>
                    <small>CUIT: ${c.cuit || 'N/A'}</small>
                </a>
            `).join('');
        }

        async function seleccionarCliente(id, nombre, cuit) {
            clienteSeleccionado = id;
            document.getElementById('buscarCliente').value = nombre;
            document.getElementById('resultadosBusqueda').innerHTML = '';
            
            document.getElementById('datosCliente').style.display = 'block';
            document.getElementById('nombreCliente').textContent = nombre;
            document.getElementById('cuitCliente').textContent = cuit;
            document.getElementById('botonesAccion').style.display = 'block';

            await Promise.all([
                cargarPedidosPendientes(id),
                cargarMovimientos(id)
            ]);
        }

        async function cargarPedidosPendientes(idCliente) {
            try {
                const response = await fetch(`${API_URL}/api/pedidos/pendientes-cobro?id_cliente=${idCliente}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Error al cargar pedidos');

                const pedidos = await response.json();
                const tbody = document.getElementById('tablaPedidos');

                if (pedidos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No hay pedidos pendientes</td></tr>';
                    document.getElementById('resumenCliente').style.display = 'none';
                    return;
                }

                let totalSaldo = 0;
                tbody.innerHTML = pedidos.map(p => {
                    totalSaldo += parseFloat(p.saldo_pendiente);
                    return `
                        <tr>
                            <td>${p.id_pedido}</td>
                            <td>${new Date(p.fecha_creacion).toLocaleDateString('es-AR')}</td>
                            <td><span class="badge bg-warning">${p.estado_entrega}</span></td>
                            <td class="text-end">$${parseFloat(p.total).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                            <td class="text-end">$${parseFloat(p.total_pagado).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                            <td class="text-end"><strong>$${parseFloat(p.saldo_pendiente).toLocaleString('es-AR', {minimumFractionDigits: 2})}</strong></td>
                        </tr>
                    `;
                }).join('');

                // Actualizar resumen
                document.getElementById('resumenCliente').style.display = 'flex';
                document.getElementById('saldoActual').textContent = `$${totalSaldo.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
                document.getElementById('pedidosPendientes').textContent = pedidos.length;

            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar pedidos pendientes');
            }
        }

        async function cargarMovimientos(idCliente) {
            try {
                const fechaDesde = document.getElementById('fechaDesde').value;
                const fechaHasta = document.getElementById('fechaHasta').value;
                
                let url = `${API_URL}/api/clientes/${idCliente}/cuenta-corriente`;
                const params = [];
                if (fechaDesde) params.push(`fecha_desde=${fechaDesde}`);
                if (fechaHasta) params.push(`fecha_hasta=${fechaHasta}`);
                if (params.length > 0) url += '?' + params.join('&');

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Error al cargar movimientos');

                const data = await response.json();
                const tbody = document.getElementById('tablaMovimientos');

                if (data.movimientos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No hay movimientos registrados</td></tr>';
                    return;
                }

                tbody.innerHTML = data.movimientos.map(m => `
                    <tr>
                        <td>${new Date(m.fecha_movimiento).toLocaleDateString('es-AR')}</td>
                        <td><span class="badge bg-${m.tipo_movimiento === 'venta' ? 'danger' : 'success'}">${m.tipo_movimiento}</span></td>
                        <td>${m.concepto || '-'}</td>
                        <td class="text-end">${m.debe > 0 ? '$' + parseFloat(m.debe).toLocaleString('es-AR', {minimumFractionDigits: 2}) : '-'}</td>
                        <td class="text-end">${m.haber > 0 ? '$' + parseFloat(m.haber).toLocaleString('es-AR', {minimumFractionDigits: 2}) : '-'}</td>
                        <td class="text-end"><strong>$${parseFloat(m.saldo).toLocaleString('es-AR', {minimumFractionDigits: 2})}</strong></td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar movimientos');
            }
        }

        function aplicarFiltros() {
            if (clienteSeleccionado) {
                cargarMovimientos(clienteSeleccionado);
            }
        }

        function irACobranzas() {
            if (clienteSeleccionado) {
                window.location.href = `cobranzas.html?id_cliente=${clienteSeleccionado}`;
            }
        }

        function exportarExcel() {
            alert('Función de exportar a Excel en desarrollo');
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
