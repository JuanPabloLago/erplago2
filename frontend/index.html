<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP LAGO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏪 ERP LAGO</span>
            <button class="btn btn-outline-danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row g-4">
            <div class="col-md-6">
                <a href="venta-rapida.html" class="btn btn-lg btn-success w-100 py-5">
                    <div class="h3">🛒 Venta Rápida</div>
                </a>
            </div>
            <div class="col-md-6">
                <a href="dashboard.html" class="btn btn-lg btn-info w-100 py-5">
                    <div class="h3">📊 Dashboard</div>
                </a>
            </div>
        </div>
    </div>
    <script>
        if (!localStorage.getItem('authToken')) window.location.href = 'login.html';
        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
