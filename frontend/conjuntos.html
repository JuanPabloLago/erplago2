<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjuntos / Kits - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/erp-lago-styles.css">
    <style>
        body { background: #f5f5f5; }
        .conjunto-card {
            border-left: 4px solid var(--color-primary);
            transition: var(--transition);
            margin-bottom: 10px;
        }
        .conjunto-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        .producto-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 3px 10px;
            margin: 2px;
            border-radius: 20px;
            font-size: 12px;
            color: #2e7d32;
        }
        .producto-tag .cantidad { font-weight: 700; }
        .resultado-busqueda {
            cursor: pointer;
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .resultado-busqueda:hover { background: #e8f5e9; }
        .item-seleccionado {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .item-seleccionado .nombre { flex: 1; }
        .item-seleccionado input { width: 70px; text-align: center; }
        .stats-card { border-left: 4px solid var(--color-success); }
        .stats-card .valor { font-size: 24px; font-weight: 700; color: var(--color-success); }
        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>

    <!-- NAVBAR estándar LAGO (auth.js inyecta offcanvas) -->
    <nav class="navbar navbar-dark gradient-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-arrow-left-circle me-1"></i> ERP LAGO
            </a>
            <span class="navbar-text text-white">
                <i class="bi bi-collection me-1"></i> Conjuntos / Kits
            </span>
        </div>
    </nav>

    <!-- BARRA DE ACCIONES -->
    <div class="container-fluid mt-3 mb-2">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-success btn-sm" id="btnNuevo" title="Ins: Nuevo conjunto">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo <kbd class="ms-1">Ins</kbd>
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="btnRefrescar" title="F5: Refrescar">
                    <i class="bi bi-arrow-clockwise"></i> <kbd>F5</kbd>
                </button>
            </div>
            <div class="d-flex gap-3 align-items-center">
                <div class="stats-card bg-white rounded p-2 px-3 shadow-sm">
                    <small class="text-muted">Conjuntos activos</small>
                    <div class="valor" id="totalConjuntos">0</div>
                </div>
                <div class="stats-card bg-white rounded p-2 px-3 shadow-sm">
                    <small class="text-muted">Total productos</small>
                    <div class="valor" id="totalProductos">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LISTA DE CONJUNTOS -->
    <div class="container-fluid">
        <div id="listaConjuntos">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div> Cargando conjuntos...
            </div>
        </div>
    </div>

    <!-- MODAL CREAR/EDITAR -->
    <div class="modal fade" id="modalConjunto" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header gradient-primary text-white">
                    <h5 class="modal-title" id="modalTitulo">
                        <i class="bi bi-plus-circle me-1"></i> Nuevo Conjunto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="idConjunto">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="nombreConjunto"
                                   placeholder="Ej: Kit Constructor Básico" autofocus>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Precio $</label>
                            <input type="number" class="form-control form-control-sm" id="precioConjunto"
                                   step="0.01" min="0" value="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Descuento %</label>
                            <input type="number" class="form-control form-control-sm" id="descuentoConjunto"
                                   min="0" max="100" value="0">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción</label>
                        <textarea class="form-control form-control-sm" id="descripcionConjunto" rows="2"
                                  placeholder="Descripción opcional del conjunto"></textarea>
                    </div>

                    <hr class="my-2">
                    <h6 class="fw-bold mb-2"><i class="bi bi-box me-1"></i> Productos del Conjunto</h6>

                    <!-- Buscador server-side -->
                    <div class="mb-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="buscarProducto"
                                   placeholder="Buscar por nombre o SKU..." autocomplete="off">
                        </div>
                        <div id="resultadosProductos" class="border rounded mt-1"
                             style="max-height: 180px; overflow-y: auto; display: none;"></div>
                    </div>

                    <!-- Items seleccionados -->
                    <div id="productosSeleccionados">
                        <div class="text-muted small text-center py-3" id="sinProductos">
                            <i class="bi bi-info-circle me-1"></i> Busca y agrega productos al conjunto
                        </div>
                    </div>
                </div>
                <!-- ─── Publicar en tienda web ───────────────────────── -->
                <div class="border-top pt-3 mt-2">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-shop me-2 text-success"></i>
                        <strong class="me-auto">Publicar en tienda web</strong>
                        <div class="form-check form-switch m-0">
                            <input type="checkbox" class="form-check-input" id="webVisible" role="switch">
                            <label class="form-check-label small" for="webVisible">Visible</label>
                        </div>
                    </div>
                    <div class="row g-2" id="webCamposExtras">
                        <div class="col-md-5">
                            <label class="form-label small text-muted mb-1">Slug URL (ej: <code>corralon</code>)</label>
                            <input type="text" class="form-control form-control-sm" id="webSlug"
                                   pattern="^[a-z0-9-]+$" maxlength="50"
                                   placeholder="minusculas-numeros-guion">
                            <div class="form-text small">Aparece en <code>lago.ar/?conjunto=&lt;slug&gt;</code>. Vacio = no aparece como tab.</div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small text-muted mb-1">Etiqueta</label>
                            <input type="text" class="form-control form-control-sm" id="webLabel"
                                   maxlength="80" placeholder="Texto visible en el topbar">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small text-muted mb-1">Orden</label>
                            <input type="number" class="form-control form-control-sm" id="webOrden"
                                   min="0" step="1" value="0">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <small class="text-muted me-auto"><kbd>F2</kbd> Guardar &nbsp; <kbd>Esc</kbd> Cerrar</small>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success btn-sm" id="btnGuardar">
                        <i class="bi bi-save me-1"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container">
        <div id="toastMsg" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/conjuntos.js"></script>
</body>
</html>
