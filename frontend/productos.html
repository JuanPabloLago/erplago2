<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .producto-card {
            transition: transform 0.2s;
        }
        .producto-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <script src="js/connection-indicator.js"></script>
    <nav class="navbar navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-arrow-left-circle"></i> ERP LAGO
            </a>
            <span class="navbar-text text-white">
                <i class="bi bi-box-seam"></i> Gestión de Productos
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-filter"></i> Filtros
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Buscar</label>
                            <input type="text" class="form-control" id="buscarProducto" 
                                   placeholder="Nombre o SKU..." onkeyup="filtrarProductos()">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" id="filtroCategoria" onchange="filtrarProductos()">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <select class="form-select" id="filtroMarca" onchange="filtrarProductos()">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary w-100" onclick="limpiarFiltros()">
                            <i class="bi bi-x-circle"></i> Limpiar Filtros
                        </button>
                    </div>
                </div>

                <div class="card shadow-sm mt-3">
                    <div class="card-header bg-success text-white">
                        <i class="bi bi-plus-circle"></i> Acciones
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success w-100 mb-2" onclick="abrirModalNuevo()">
                            <i class="bi bi-plus-circle"></i> Nuevo Producto
                        </button>
                        <button class="btn btn-info w-100" onclick="cargarProductos()">
                            <i class="bi bi-arrow-clockwise"></i> Recargar
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between">
                        <span><i class="bi bi-list"></i> Lista de Productos</span>
                        <span id="contadorProductos" class="badge bg-light text-dark">0 productos</span>
                    </div>
                    <div class="card-body">
                        <div id="listaProductos">
                            <div class="text-center">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                Cargando productos...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitulo">
                        <i class="bi bi-plus-circle"></i> Nuevo Producto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProducto">
                        <input type="hidden" id="idProducto">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">SKU <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="sku" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Categoría</label>
                                    <select class="form-select" id="idCategoria">
                                        <option value="">Sin categoría</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Marca</label>
                                    <select class="form-select" id="idMarca">
                                        <option value="">Sin marca</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="3"></textarea>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="tieneVariantes">
                            <label class="form-check-label" for="tieneVariantes">
                                <i class="bi bi-boxes"></i> Este producto tiene variantes
                                <small class="text-muted d-block">Marca esto si el producto tendrá variantes (colores, talles, granos, etc)</small>
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarProducto()">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://72.60.148.18:3000/api';
        let productos = [];
        let categorias = [];
        let marcas = [];
        let modalProducto;

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            modalProducto = new bootstrap.Modal(document.getElementById('modalProducto'));
            await Promise.all([
                cargarCategorias(),
                cargarMarcas(),
                cargarProductos()
            ]);
        });

        async function cargarCategorias() {
            try {
                const response = await fetch(`${API_URL}/categorias`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                categorias = await response.json();
                
                // Llenar filtro
                const filtro = document.getElementById('filtroCategoria');
                filtro.innerHTML = '<option value="">Todas</option>' + 
                    categorias.map(c => `<option value="${c.id_categoria}">${c.nombre}</option>`).join('');

                // Llenar select del modal
                const select = document.getElementById('idCategoria');
                select.innerHTML = '<option value="">Sin categoría</option>' + 
                    categorias.map(c => `<option value="${c.id_categoria}">${c.nombre}</option>`).join('');
            } catch (error) {
                console.error('Error al cargar categorías:', error);
            }
        }

        async function cargarMarcas() {
            try {
                const response = await fetch(`${API_URL}/marcas`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                marcas = await response.json();
                
                // Llenar filtro
                const filtro = document.getElementById('filtroMarca');
                filtro.innerHTML = '<option value="">Todas</option>' + 
                    marcas.map(m => `<option value="${m.id_marca}">${m.nombre}</option>`).join('');

                // Llenar select del modal
                const select = document.getElementById('idMarca');
                select.innerHTML = '<option value="">Sin marca</option>' + 
                    marcas.map(m => `<option value="${m.id_marca}">${m.nombre}</option>`).join('');
            } catch (error) {
                console.error('Error al cargar marcas:', error);
            }
        }

        async function cargarProductos() {
            try {
                const response = await fetch(`${API_URL}/productos`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });

                if (response.status === 403 || response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                productos = await response.json();
                filtrarProductos();
            } catch (error) {
                console.error('Error al cargar productos:', error);
                document.getElementById('listaProductos').innerHTML = 
                    '<div class="alert alert-danger">Error al cargar productos</div>';
            }
        }

        function filtrarProductos() {
            const busqueda = document.getElementById('buscarProducto').value.toLowerCase();
            const categoriaFiltro = document.getElementById('filtroCategoria').value;
            const marcaFiltro = document.getElementById('filtroMarca').value;

            let filtrados = productos.filter(p => {
                const matchBusqueda = !busqueda || 
                    p.nombre.toLowerCase().includes(busqueda) || 
                    p.sku.toLowerCase().includes(busqueda);
                
                const matchCategoria = !categoriaFiltro || 
                    (p.id_categoria && p.id_categoria.toString() === categoriaFiltro);
                
                const matchMarca = !marcaFiltro || 
                    (p.id_marca && p.id_marca.toString() === marcaFiltro);

                return matchBusqueda && matchCategoria && matchMarca;
            });

            mostrarProductos(filtrados);
        }

        function mostrarProductos(listaProductos) {
            const container = document.getElementById('listaProductos');
            document.getElementById('contadorProductos').textContent = `${listaProductos.length} productos`;

            if (listaProductos.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No se encontraron productos</div>';
                return;
            }

            container.innerHTML = listaProductos.map(p => {
                const categoria = categorias.find(c => c.id_categoria === p.id_categoria);
                const marca = marcas.find(m => m.id_marca === p.id_marca);

                return `
                    <div class="card producto-card mb-2">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-5">
                                    <h6 class="mb-1">
                                        <i class="bi bi-box-seam text-primary"></i> ${p.nombre}
                                        ${p.tiene_variantes ? '<span class="badge bg-info ms-1">Con variantes</span>' : ''}
                                    </h6>
                                    <small class="text-muted">SKU: ${p.sku}</small>
                                </div>
                                <div class="col-md-3">
                                    ${categoria ? `<span class="badge bg-secondary"><i class="bi bi-tag"></i> ${categoria.nombre}</span>` : ''}
                                    ${marca ? `<span class="badge bg-dark ms-1"><i class="bi bi-award"></i> ${marca.nombre}</span>` : ''}
                                </div>
                                <div class="col-md-2">
                                    <span class="badge bg-success">Stock: ${p.stock_real || 0}</span>
                                </div>
                                <div class="col-md-2 text-end">
                                    ${p.tiene_variantes ? 
                                        `<button class="btn btn-sm btn-info me-1" onclick="verVariantes(${p.id_producto})" title="Ver variantes">
                                            <i class="bi bi-boxes"></i>
                                        </button>` : ''}
                                    <button class="btn btn-sm btn-warning me-1" onclick="editarProducto(${p.id_producto})" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${p.id_producto}, '${p.nombre}')" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            ${p.descripcion ? `<p class="text-muted small mb-0 mt-2">${p.descripcion}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function limpiarFiltros() {
            document.getElementById('buscarProducto').value = '';
            document.getElementById('filtroCategoria').value = '';
            document.getElementById('filtroMarca').value = '';
            filtrarProductos();
        }

        function abrirModalNuevo() {
            document.getElementById('formProducto').reset();
            document.getElementById('idProducto').value = '';
            document.getElementById('modalTitulo').innerHTML = '<i class="bi bi-plus-circle"></i> Nuevo Producto';
            modalProducto.show();
        }

        async function editarProducto(id_producto) {
            const producto = productos.find(p => p.id_producto === id_producto);
            
            document.getElementById('idProducto').value = producto.id_producto;
            document.getElementById('sku').value = producto.sku;
            document.getElementById('nombre').value = producto.nombre;
            document.getElementById('descripcion').value = producto.descripcion || '';
            document.getElementById('idCategoria').value = producto.id_categoria || '';
            document.getElementById('idMarca').value = producto.id_marca || '';
            document.getElementById('tieneVariantes').checked = producto.tiene_variantes || false;

            document.getElementById('modalTitulo').innerHTML = '<i class="bi bi-pencil"></i> Editar Producto';
            modalProducto.show();
        }

        async function guardarProducto() {
            const id_producto = document.getElementById('idProducto').value;
            const datos = {
                sku: document.getElementById('sku').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value
            };

            const idCategoria = document.getElementById('idCategoria').value;
            const idMarca = document.getElementById('idMarca').value;

            if (idCategoria) datos.id_categoria = parseInt(idCategoria);
            if (idMarca) datos.id_marca = parseInt(idMarca);

            if (!datos.sku || !datos.nombre) {
                alert('SKU y nombre son requeridos');
                return;
            }

            try {
                const url = id_producto 
                    ? `${API_URL}/productos/${id_producto}` 
                    : `${API_URL}/productos`;
                const method = id_producto ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify(datos)
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    modalProducto.hide();
                    await cargarProductos();
                } else {
                    alert(result.error || 'Error al guardar producto');
                }
            } catch (error) {
                console.error('Error al guardar producto:', error);
                alert('Error al guardar producto');
            }
        }

        async function eliminarProducto(id_producto, nombre) {
            if (!confirm(`¿Está seguro que desea eliminar el producto "${nombre}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/productos/${id_producto}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    await cargarProductos();
                } else {
                    alert(result.error || 'Error al eliminar producto');
                }
            } catch (error) {
                console.error('Error al eliminar producto:', error);
                alert('Error al eliminar producto');
            }
        }

        function verVariantes(id_producto) {
            window.location.href = `variantes.html?producto=${id_producto}`;
        }

        function cerrarSesion() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
