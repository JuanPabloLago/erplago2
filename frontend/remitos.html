<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remitos - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/erp-lago-styles.css" rel="stylesheet">
    <style>
        .cursor-pointer { cursor: pointer; }
        .cursor-pointer:hover { background-color: rgba(0,0,0,0.04); }
        tr[data-id]:focus { outline: 2px solid var(--bs-primary); outline-offset: -2px; }
    </style>
</head>
<body>
    <!-- Auth y config se cargan primero -->
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>


    <!-- Navbar LAGO estándar -->
    <nav class="navbar navbar-dark" style="background: linear-gradient(135deg, #1b8a4a 0%, #145a32 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-truck"></i> Remitos
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text text-white-50 small d-none d-md-inline" id="userInfo"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-3">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="mb-0"><i class="bi bi-truck"></i> Remitos</h4>
                <small class="text-muted">Consulta y seguimiento de remitos emitidos</small>
            </div>
            <div>
                <button id="btnExportar" class="btn btn-outline-success btn-sm" title="Exportar a CSV">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exportar
                </button>
            </div>
        </div>

        <!-- Estadísticas -->
        <div id="statsContainer" class="mb-3"></div>

        <!-- Filtros -->
        <div class="card mb-3">
            <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small mb-0">Buscar</label>
                        <input type="text" id="txtBusqueda" class="form-control form-control-sm" 
                               placeholder="Número, cliente, obs..." autofocus>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Estado</label>
                        <select id="filtroEstado" class="form-select form-select-sm">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Desde</label>
                        <input type="date" id="filtroFechaDesde" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Hasta</label>
                        <input type="date" id="filtroFechaHasta" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3 d-flex gap-1">
                        <button id="btnBuscar" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="bi bi-search"></i> Buscar
                        </button>
                        <button id="btnLimpiar" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Remito</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Pedido</th>
                            <th>Depósito</th>
                            <th class="text-center">Items</th>
                            <th>Estado</th>
                            <th class="text-center" style="width:60px">
                                <i class="bi bi-gear"></i>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tablaRemitosBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Paginación -->
            <div class="card-footer d-flex justify-content-between align-items-center py-1">
                <span id="infoPaginacion" class="small text-muted">-</span>
                <div class="btn-group btn-group-sm">
                    <button id="btnAnterior" class="btn btn-outline-secondary" disabled>
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button id="btnSiguiente" class="btn btn-outline-secondary" disabled>
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title">Detalle de Remito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalDetalleContenido">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
                <div class="modal-footer py-1">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/connection-indicator.js"></script>
    <script src="js/remitos.js"></script>
</body>
</html>
