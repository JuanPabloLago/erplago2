<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Compra - ERP LAGO</title>
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/erp-lago-styles.css">
    <style>
        .comp-header { background: linear-gradient(135deg, #2d3436, #636e72); color: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .comp-header .badge-anulado { background: #dc3545; font-size: 1rem; }
        .comp-header .badge-pendiente { background: #ffc107; color: #000; font-size: 1rem; }
        .comp-header .badge-pagado { background: #198754; font-size: 1rem; }
        .item-row:nth-child(even) { background: #f8f9fa; }
        .totales-box { background: #f8f9fa; border-radius: 8px; padding: 16px; }
        .dato-label { color: #6c757d; font-size: 0.85rem; }
        @media print { .no-print { display: none !important; } body { padding: 0; } .comp-header { background: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-building"></i> ERP LAGO</a>
            <div class="navbar-nav ms-auto">
                <button class="btn btn-outline-light btn-sm me-2" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
                <button class="btn btn-outline-light btn-sm" onclick="history.back()"><i class="bi bi-arrow-left"></i> Volver</button>
            </div>
        </div>
    </nav>

    <div class="container py-3" id="contenido">
        <div class="text-center py-5" id="loading">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Cargando comprobante...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const API_BASE = window.CONFIG?.API_BASE_URL || '/api';
    const TK = window.CONFIG?.TOKEN_KEY || 'authToken';
    function hdr() { return { 'Authorization': 'Bearer ' + (localStorage.getItem(TK)||'') }; }
    function fm(v) { return '$ ' + (parseFloat(v)||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fd(v) { return v ? new Date(v).toLocaleDateString('es-AR') : '-'; }
    function esc(s) { if (!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) { window.location.href = "/compras.html"; return; }

        try {
            const res = await fetch(API_BASE + '/compras/' + id, { headers: hdr() });
            if (!res.ok) throw new Error(res.status === 404 ? 'Comprobante no encontrado' : 'Error ' + res.status);
            const json = await res.json();
            if (!json.success) throw new Error(json.error || 'Error');
            renderComprobante(json.data);
        } catch (e) {
            document.getElementById('contenido').innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> ' + e.message + '</div>';
        }
    });

    function renderComprobante(c) {
        const estadoBadge = c.estado === 'anulado' ? 'badge-anulado' : (c.estado === 'pagado' ? 'badge-pagado' : 'badge-pendiente');
        const items = c.items || [];

        let html = '';

        // HEADER
        html += '<div class="comp-header">';
        html += '<div class="row align-items-center">';
        html += '<div class="col-md-6">';
        html += '<h3 class="mb-1"><i class="bi bi-receipt"></i> ' + esc(c.tipo_nombre || 'Comprobante') + '</h3>';
        html += '<h2 class="mb-0">' + esc(c.numero_completo) + '</h2>';
        html += '</div>';
        html += '<div class="col-md-6 text-md-end">';
        html += '<span class="badge ' + estadoBadge + ' mb-2">' + esc(c.estado?.toUpperCase()) + '</span><br>';
        html += '<span class="dato-label" style="color:#ccc">Fecha emisión</span><br>';
        html += '<strong style="font-size:1.2rem">' + fd(c.fecha_emision) + '</strong>';
        if (c.fecha_vencimiento) html += '<br><span class="dato-label" style="color:#ccc">Vencimiento: </span>' + fd(c.fecha_vencimiento);
        html += '</div></div></div>';

        // PROVEEDOR + DATOS
        html += '<div class="row mb-3">';
        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += '<h6 class="card-title text-muted"><i class="bi bi-building"></i> Proveedor</h6>';
        html += '<strong style="font-size:1.1rem">' + esc(c.proveedor_razon_social) + '</strong>';
        if (c.proveedor_nombre_fantasia) html += '<br><small class="text-muted">' + esc(c.proveedor_nombre_fantasia) + '</small>';
        html += '<br>CUIT: ' + esc(c.proveedor_cuit || '-');
        html += '<br>IVA: ' + esc(c.proveedor_condicion_iva || '-');
        if (c.proveedor_domicilio) html += '<br>' + esc(c.proveedor_domicilio);
        html += '</div></div></div>';

        html += '<div class="col-md-6"><div class="card"><div class="card-body">';
        html += '<h6 class="card-title text-muted"><i class="bi bi-info-circle"></i> Datos del Comprobante</h6>';
        html += '<div class="row"><div class="col-6">';
        html += '<span class="dato-label">Tipo</span><br><strong>' + esc(c.tipo_codigo) + ' - ' + esc(c.tipo_nombre) + '</strong>';
        html += '<br><span class="dato-label">Moneda</span><br><strong>' + esc(c.moneda_codigo || 'ARS') + '</strong>';
        html += '</div><div class="col-6">';
        html += '<span class="dato-label">Registrado por</span><br><strong>' + esc(c.usuario_nombre || '-') + '</strong>';
        html += '<br><span class="dato-label">Fecha registro</span><br><strong>' + fd(c.created_at || c.fecha_emision) + '</strong>';
        html += '</div></div>';
        if (c.observaciones) html += '<br><span class="dato-label">Observaciones:</span> ' + esc(c.observaciones);
        html += '</div></div></div>';
        html += '</div>';

        // ITEMS
        if (items.length) {
            html += '<div class="card mb-3"><div class="card-header bg-dark text-white"><i class="bi bi-list-ul"></i> Items del Comprobante <span class="badge bg-light text-dark ms-2">' + items.length + '</span></div>';
            html += '<div class="table-responsive"><table class="table table-sm mb-0">';
            html += '<thead class="table-light"><tr><th>Producto</th><th>SKU</th><th class="text-center">Cant.</th><th class="text-end">P.Unit.</th><th class="text-center">IVA %</th><th class="text-end">Subtotal</th></tr></thead><tbody>';
            items.forEach(item => {
                html += '<tr class="item-row">';
                html += '<td><strong>' + esc(item.producto_nombre || item.descripcion || '-') + '</strong></td>';
                html += '<td><small class="text-muted">' + esc(item.producto_sku || '-') + '</small></td>';
                html += '<td class="text-center">' + (item.cantidad || 0) + '</td>';
                html += '<td class="text-end">' + fm(item.precio_unitario) + '</td>';
                html += '<td class="text-center">' + (item.alicuota_porcentaje || 0) + '%</td>';
                html += '<td class="text-end fw-bold">' + fm(item.subtotal) + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div></div>';
        }

        // TOTALES
        html += '<div class="row justify-content-end mb-3"><div class="col-md-5">';
        html += '<div class="totales-box">';
        if (c.subtotal_gravado) html += '<div class="d-flex justify-content-between"><span>Gravado:</span><span>' + fm(c.subtotal_gravado) + '</span></div>';
        if (c.subtotal_no_gravado) html += '<div class="d-flex justify-content-between"><span>No Gravado:</span><span>' + fm(c.subtotal_no_gravado) + '</span></div>';
        if (c.subtotal_exento) html += '<div class="d-flex justify-content-between"><span>Exento:</span><span>' + fm(c.subtotal_exento) + '</span></div>';
        if (c.iva_27) html += '<div class="d-flex justify-content-between"><span>IVA 27%:</span><span>' + fm(c.iva_27) + '</span></div>';
        if (c.iva_21) html += '<div class="d-flex justify-content-between"><span>IVA 21%:</span><span>' + fm(c.iva_21) + '</span></div>';
        if (c.iva_10_5) html += '<div class="d-flex justify-content-between"><span>IVA 10.5%:</span><span>' + fm(c.iva_10_5) + '</span></div>';
        if (c.percepciones_iva) html += '<div class="d-flex justify-content-between"><span>Perc. IVA:</span><span>' + fm(c.percepciones_iva) + '</span></div>';
        if (c.percepciones_iibb) html += '<div class="d-flex justify-content-between"><span>Perc. IIBB:</span><span>' + fm(c.percepciones_iibb) + '</span></div>';
        if (c.impuestos_internos) html += '<div class="d-flex justify-content-between"><span>Imp. Internos:</span><span>' + fm(c.impuestos_internos) + '</span></div>';
        html += '<hr class="my-2">';
        html += '<div class="d-flex justify-content-between fw-bold" style="font-size:1.3rem"><span>TOTAL:</span><span>' + fm(c.total) + '</span></div>';
        html += '</div></div></div>';

        // CC INFO
        if (c.cuenta_corriente) {
            const cc = c.cuenta_corriente;
            html += '<div class="card mb-3"><div class="card-body">';
            html += '<h6><i class="bi bi-journal-text"></i> Estado en Cuenta Corriente</h6>';
            html += '<div class="row"><div class="col-4">Monto original: <strong>' + fm(cc.monto) + '</strong></div>';
            html += '<div class="col-4">Saldo pendiente: <strong class="' + (parseFloat(cc.saldo) > 0 ? 'text-danger' : 'text-success') + '">' + fm(cc.saldo) + '</strong></div>';
            html += '<div class="col-4">Vencimiento: <strong>' + fd(cc.fecha_vencimiento) + '</strong></div></div>';
            html += '</div></div>';
        }

        // ANULADO INFO
        if (c.estado === 'anulado' && c.motivo_anulacion) {
            html += '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> <strong>ANULADO</strong> — ' + esc(c.motivo_anulacion) + '</div>';
        }

        document.getElementById('contenido').innerHTML = html;
        document.title = (c.numero_completo || 'Comprobante') + ' - ERP LAGO';
    }
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
