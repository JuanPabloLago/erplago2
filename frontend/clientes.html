<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - ERP Lago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .table-hover tbody tr.table-active,
        .table-hover tbody tr.table-active:hover {
            background-color: #cfe2ff;
            cursor: pointer;
        }
        .search-highlight {
            background-color: #fff3cd;
            font-weight: bold;
        }
        #buscador:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body>
    <script src="js/connection-indicator.js"></script>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-people-fill"></i> Gestión de Clientes</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#clienteModal" id="btnNuevoCliente">
                <i class="bi bi-plus-circle"></i> Nuevo Cliente
            </button>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar por cualquier campo... (nombre, CUIT, email, teléfono, domicilio, IVA)">
                    <button class="btn btn-outline-secondary" type="button" id="btnLimpiar" title="Limpiar búsqueda">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
                <div id="resultadosInfo" class="text-muted small mb-2"></div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Razón Social</th>
                                <th>CUIT/CUIL</th>
                                <th>Condición IVA</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaClientesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="clienteModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Datos del Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="clienteForm">
                        <input type="hidden" id="clienteId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="razon_social" class="form-label">Razón Social (*)</label>
                                <input type="text" class="form-control" id="razon_social" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="cuit_cuil" class="form-label">CUIT/CUIL</label>
                                <input type="text" class="form-control" id="cuit_cuil">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="domicilio" class="form-label">Domicilio</label>
                            <input type="text" class="form-control" id="domicilio">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="telefono">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_condicion_iva" class="form-label">Condición IVA (*)</label>
                                <select class="form-select" id="id_condicion_iva" required>
                                    <option value="1">Responsable Inscripto</option>
                                    <option value="2">Monotributo</option>
                                    <option value="3">Exento</option>
                                    <option value="4">Consumidor Final</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_lista_precio" class="form-label">Lista de Precios</label>
                                <select class="form-select" id="id_lista_precio">
                                    <option value="1">Lista General</option>
                                    <option value="3">Lista Distribuidores (-7%)</option>
                                    <option value="4">Lista Promocional (-20%)</option>
                                    <option value="2" disabled>Lista Minorista Plus (+15%)</option>
                                    <option value="5" disabled>Lista VIP (-25%)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="descuento_predefinido" class="form-label">Descuento Predefinido (%)</label>
                                <input type="number" class="form-control" id="descuento_predefinido" min="0" max="100" step="0.01" value="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" form="clienteForm">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            const API_URL = '/api/clientes';
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const tablaBody = document.getElementById('tablaClientesBody');
            const buscador = document.getElementById('buscador');
            const btnLimpiar = document.getElementById('btnLimpiar');
            const resultadosInfo = document.getElementById('resultadosInfo');
            const clienteModal = new bootstrap.Modal(document.getElementById('clienteModal'));
            const clienteForm = document.getElementById('clienteForm');
            const modalLabel = document.getElementById('modalLabel');
            
            let allClientes = [];
            let clientesFiltrados = [];
            let selectedIndex = -1;

            // FUNCIÓN PARA NORMALIZAR TEXTO
            const normalizarTexto = (texto) => {
                if (!texto) return '';
                return texto
                    .toString()
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .trim();
            };

            // CARGAR CLIENTES
            const cargarClientes = async () => {
                try {
                    const response = await fetch(API_URL, { headers });
                    if (!response.ok) throw new Error('No se pudieron cargar los clientes.');
                    allClientes = await response.json();
                    clientesFiltrados = allClientes;
                    renderizarTabla(clientesFiltrados);
                } catch (error) {
                    console.error('Error al cargar clientes:', error);
                    alert('No se pudieron cargar los clientes. Verifique la consola.');
                }
            };

            // RENDERIZAR TABLA
            const renderizarTabla = (clientes) => {
                tablaBody.innerHTML = '';
                selectedIndex = -1;

                if (buscador.value.trim()) {
                    resultadosInfo.textContent = `Mostrando ${clientes.length} de ${allClientes.length} clientes`;
                } else {
                    resultadosInfo.textContent = `Total: ${clientes.length} clientes`;
                }

                if (clientes.length === 0) {
                    tablaBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No se encontraron clientes.</td></tr>';
                    return;
                }

                clientes.forEach(cliente => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${cliente.razon_social || ''}</td>
                        <td>${cliente.cuit_cuil || ''}</td>
                        <td>${cliente.condicion_iva || ''}</td>
                        <td>${cliente.email || ''}</td>
                        <td>
                            <button class="btn btn-sm btn-warning btn-editar" data-id="${cliente.id_cliente}" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-danger btn-eliminar" data-id="${cliente.id_cliente}" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                    tablaBody.appendChild(tr);
                });
            };

            // BÚSQUEDA MEJORADA
            const buscarClientes = () => {
                const textoBuscado = buscador.value.trim();
                
                if (!textoBuscado) {
                    clientesFiltrados = allClientes;
                    renderizarTabla(clientesFiltrados);
                    return;
                }

                const terminos = textoBuscado
                    .split(' ')
                    .map(t => normalizarTexto(t))
                    .filter(t => t.length > 0);

                if (terminos.length === 0) {
                    clientesFiltrados = allClientes;
                    renderizarTabla(clientesFiltrados);
                    return;
                }

                clientesFiltrados = allClientes.filter(cliente => {
                    const textoCompleto = normalizarTexto([
                        cliente.razon_social || '',
                        cliente.cuit_cuil || '',
                        cliente.condicion_iva || '',
                        cliente.email || '',
                        cliente.telefono || '',
                        cliente.domicilio || ''
                    ].join(' '));

                    return terminos.every(termino => textoCompleto.includes(termino));
                });

                renderizarTabla(clientesFiltrados);
            };

            buscador.addEventListener('input', (e) => {
                if (e.inputType) {
                    buscarClientes();
                }
            });

            btnLimpiar.addEventListener('click', () => {
                buscador.value = '';
                buscarClientes();
                buscador.focus();
            });

            buscador.addEventListener('keydown', (e) => {
                const rows = tablaBody.querySelectorAll('tr');
                if (rows.length === 0 || (rows.length === 1 && rows[0].children.length === 1)) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex++;
                    if (selectedIndex >= rows.length) selectedIndex = 0;
                    updateSelection(rows);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex--;
                    if (selectedIndex < 0) selectedIndex = rows.length - 1;
                    updateSelection(rows);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIndex > -1 && rows[selectedIndex]) {
                        const editButton = rows[selectedIndex].querySelector('.btn-editar');
                        if (editButton) editButton.click();
                    }
                } else if (e.key === 'Escape') {
                    buscador.value = '';
                    buscarClientes();
                }
            });

            const updateSelection = (rows) => {
                rows.forEach(row => row.classList.remove('table-active'));
                if (selectedIndex > -1 && rows[selectedIndex]) {
                    const selectedRow = rows[selectedIndex];
                    selectedRow.classList.add('table-active');
                    selectedRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            };

            document.getElementById('btnNuevoCliente').addEventListener('click', () => {
                clienteForm.reset();
                document.getElementById('clienteId').value = '';
                modalLabel.textContent = 'Nuevo Cliente';
            });

            clienteForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('clienteId').value;
                const body = {
                    razon_social: document.getElementById('razon_social').value,
                    cuit_cuil: document.getElementById('cuit_cuil').value,
                    domicilio: document.getElementById('domicilio').value,
                    telefono: document.getElementById('telefono').value,
                    email: document.getElementById('email').value,
                    id_condicion_iva: parseInt(document.getElementById('id_condicion_iva').value),
                    id_lista_precio: parseInt(document.getElementById('id_lista_precio').value) || 1,
                    descuento_predefinido: parseFloat(document.getElementById('descuento_predefinido').value) || 0,
                    id_lista_precio: parseInt(document.getElementById('id_lista_precio').value) || 1,
                    descuento_predefinido: parseFloat(document.getElementById('descuento_predefinido').value) || 0,
                    id_lista_precio: parseInt(document.getElementById('id_lista_precio').value)
                };

                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/${id}` : API_URL;

                try {
                    const response = await fetch(url, { method, headers, body: JSON.stringify(body) });
                    if (!response.ok) throw new Error('No se pudo guardar el cliente.');
                    clienteModal.hide();
                    await cargarClientes();
                    if (buscador.value.trim()) {
                        buscarClientes();
                    }
                } catch (error) {
                    console.error('Error al guardar cliente:', error);
                    alert('No se pudo guardar el cliente.');
                }
            });

            tablaBody.addEventListener('click', async (e) => {
                const target = e.target.closest('button');
                if (!target) return;
                const id = target.dataset.id;

                if (target.classList.contains('btn-editar')) {
                    try {
                        const response = await fetch(`${API_URL}/${id}`, { headers });
                        if (!response.ok) throw new Error('Cliente no encontrado');
                        const cliente = await response.json();

                        document.getElementById('clienteId').value = cliente.id_cliente;
                        document.getElementById('razon_social').value = cliente.razon_social || '';
                        document.getElementById('cuit_cuil').value = cliente.cuit_cuil || '';
                        document.getElementById('domicilio').value = cliente.domicilio || '';
                        document.getElementById('email').value = cliente.email || '';
                        document.getElementById('telefono').value = cliente.telefono || '';
                        document.getElementById('id_condicion_iva').value = cliente.id_condicion_iva;
                    document.getElementById('id_lista_precio').value = cliente.id_lista_precio || 1;
                    document.getElementById('descuento_predefinido').value = cliente.descuento_predefinido || 0;
                    document.getElementById('id_lista_precio').value = cliente.id_lista_precio || 1;
                    document.getElementById('descuento_predefinido').value = cliente.descuento_predefinido || 0;
                        document.getElementById('id_lista_precio').value = cliente.id_lista_precio || 1;

                        modalLabel.textContent = 'Editar Cliente';
                        clienteModal.show();
                    } catch (error) {
                        console.error('Error al cargar datos para editar:', error);
                        alert('No se pudieron cargar los datos del cliente.');
                    }
                }

                if (target.classList.contains('btn-eliminar')) {
                    if (confirm('¿Estás seguro de que quieres eliminar este cliente?')) {
                        try {
                            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE', headers });
                            if (!response.ok) throw new Error('No se pudo eliminar el cliente.');
                            await cargarClientes();
                            if (buscador.value.trim()) {
                                buscarClientes();
                            }
                        } catch (error) {
                            console.error('Error al eliminar cliente:', error);
                            alert('No se pudo eliminar el cliente.');
                        }
                    }
                }
            });

            cargarClientes();
            buscador.focus();
        });
    </script>
</body>
</html>
