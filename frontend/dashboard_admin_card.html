<!-- Tarjeta de Administración (solo para admin) -->
<div class="col-md-4" id="cardAdmin" style="display: none;">
    <div class="card shadow-sm">
        <div class="card-body text-center">
            <i class="bi bi-shield-lock" style="font-size: 3rem; color: #dc3545;"></i>
            <h5 class="card-title mt-3">Administración</h5>
            <p class="card-text">Gestionar usuarios, roles y permisos</p>
            <a href="admin-usuarios.html" class="btn btn-danger">
                <i class="bi bi-gear"></i> Administrar
            </a>
        </div>
    </div>
</div>

<script>
// Mostrar solo si es admin
document.addEventListener('DOMContentLoaded', () => {
    const rol = localStorage.getItem('userRole') || '';
    if (rol === 'admin' || rol === 'administrador') {
        document.getElementById('cardAdmin').style.display = 'block';
    }
});
</script>
