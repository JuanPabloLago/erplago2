<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Listas de Precios - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .lista-card {
            transition: all 0.3s;
            border-left: 4px solid #dee2e6;
        }
        .lista-card.activa {
            border-left-color: #28a745;
            background-color: #f0fff4;
        }
        .lista-card.inactiva {
            border-left-color: #dc3545;
            background-color: #fff5f5;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
            <span class="navbar-text text-white">
                <i class="bi bi-tag-fill"></i> Gestión de Listas de Precios
            </span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-tags"></i> Listas de Precios del Sistema
                        </h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">
                            <i class="bi bi-info-circle"></i> 
                            Activa o desactiva las listas de precios. Solo las listas activas aparecerán en el POS.
                        </p>
                        
                        <div id="listasContainer" class="row g-3">
                            <!-- Las listas se cargarán aquí -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        const API_URL = 'http://72.60.148.18:3000';
        let token = localStorage.getItem('authToken');

        // Verificar autenticación
        if (!token) {
            window.location.href = 'login.html';
        }

        // Cargar listas
        async function cargarListas() {
            try {
                const response = await fetch(`${API_URL}/api/admin/listas-precios`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error('Error al cargar listas');
                }

                const listas = await response.json();
                mostrarListas(listas);
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudieron cargar las listas de precios', 'error');
            }
        }

        // Mostrar listas
        function mostrarListas(listas) {
            const container = document.getElementById('listasContainer');
            container.innerHTML = '';

            listas.forEach(lista => {
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';
                
                const estadoClass = lista.activa ? 'activa' : 'inactiva';
                const estadoBadge = lista.activa 
                    ? '<span class="badge bg-success">Activa</span>' 
                    : '<span class="badge bg-danger">Desactivada</span>';
                
                const switchChecked = lista.activa ? 'checked' : '';
                
                card.innerHTML = `
                    <div class="card lista-card ${estadoClass} h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-tag"></i> ${lista.nombre}
                                </h5>
                                ${estadoBadge}
                            </div>
                            
                            <p class="card-text text-muted small">
                                ${lista.descripcion || 'Sin descripción'}
                            </p>
                            
                            <div class="form-check form-switch">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       id="switch${lista.id_lista_precio}"
                                       ${switchChecked}
                                       onchange="toggleLista(${lista.id_lista_precio}, this.checked)">
                                <label class="form-check-label" for="switch${lista.id_lista_precio}">
                                    ${lista.activa ? 'Desactivar' : 'Activar'} lista
                                </label>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Activar/Desactivar lista
        async function toggleLista(id, activa) {
            try {
                const response = await fetch(`${API_URL}/api/admin/listas-precios/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ activa })
                });

                if (!response.ok) {
                    throw new Error('Error al actualizar lista');
                }

                const data = await response.json();
                
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: data.message,
                    timer: 2000,
                    showConfirmButton: false
                });

                // Recargar listas
                setTimeout(() => cargarListas(), 2000);

            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo actualizar la lista', 'error');
                
                // Revertir el switch
                const checkbox = document.getElementById(`switch${id}`);
                checkbox.checked = !activa;
            }
        }

        // Cargar al iniciar
        cargarListas();
    </script>
    <script src="js/connection-indicator.js"></script>
</body>
</html>
