<!DOCTYPE html>
<html>
<head>
    <script src="js/config.js"></script>
    <title>Diagnóstico Completo</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h2>Diagnóstico del Sistema</h2>
    
    <button onclick="verificarToken()">1. Verificar Token</button>
    <button onclick="testBusqueda()">2. Test Búsqueda</button>
    <button onclick="limpiarYLogin()">3. Limpiar y Login</button>
    
    <pre id="resultado"></pre>
    
    <script>
        const log = (msg) => {
            document.getElementById('resultado').textContent += msg + '\n';
        };
        
        function verificarToken() {
            document.getElementById('resultado').textContent = '';
            log('=== VERIFICANDO TOKEN ===\n');
            
            const token = localStorage.getItem('token');
            const authToken = localStorage.getItem('authToken');
            const username = localStorage.getItem('username');
            
            log('token: ' + (token || 'NO EXISTE'));
            log('authToken: ' + (authToken ? authToken.substring(0, 50) + '...' : 'NO EXISTE'));
            log('username: ' + (username || 'NO EXISTE'));
            
            if (!authToken) {
                log('\n❌ NO HAY TOKEN! Necesitas hacer login.');
            } else {
                log('\n✅ Token encontrado');
                // Decodificar JWT (sin verificar)
                try {
                    const payload = JSON.parse(atob(authToken.split('.')[1]));
                    log('\nPayload del token:');
                    log(JSON.stringify(payload, null, 2));
                    
                    const exp = new Date(payload.exp * 1000);
                    const now = new Date();
                    log('\nExpira: ' + exp.toLocaleString());
                    log('Ahora: ' + now.toLocaleString());
                    log('¿Expirado?: ' + (now > exp ? 'SÍ ❌' : 'NO ✅'));
                } catch (e) {
                    log('❌ Error decodificando token: ' + e.message);
                }
            }
        }
        
        async function testBusqueda() {
            document.getElementById('resultado').textContent = '';
            log('=== TEST BÚSQUEDA ===\n');
            
            const authToken = localStorage.getItem('authToken');
            if (!authToken) {
                log('❌ No hay token. Hacé login primero.');
                return;
            }
            
            try {
                log('Buscando "consumidor"...\n');
                
                const response = await fetch('/api/clientes/buscar?q=consumidor', {
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    }
                });
                
                log('Status: ' + response.status + ' ' + response.statusText);
                
                const data = await response.json();
                log('\nRespuesta:');
                log(JSON.stringify(data, null, 2));
                
                if (response.ok) {
                    log('\n✅ BÚSQUEDA EXITOSA!');
                } else {
                    log('\n❌ ERROR EN LA BÚSQUEDA');
                }
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        }
        
        function limpiarYLogin() {
            localStorage.clear();
            alert('LocalStorage limpiado');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
