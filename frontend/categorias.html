<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <title>Categorías - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background:#f8f9fa; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .header-lago { background:linear-gradient(135deg,#1a5f7a 0%,#0d3b4f 100%); padding:1rem 0; color:white; }
        .header-content { max-width:1600px; margin:0 auto; padding:0 1rem; display:flex; align-items:center; gap:1rem; }
        .header-logo { color:white; text-decoration:none; font-weight:600; font-size:1.25rem; }
        .col-panel { background:white; border:1px solid #e2e8f0; border-radius:8px; }
        .col-header { background:#f1f5f9; padding:.75rem 1rem; border-bottom:1px solid #e2e8f0; border-radius:8px 8px 0 0; }
        .lista-item { padding:.5rem .75rem; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:.5rem; cursor:pointer; }
        .lista-item:hover { background:#f8fafc; }
        .lista-item.activa { background:#1a5f7a; color:white; }
        .lista-item.activa .badge-cnt { background:white; color:#1a5f7a; }
        .badge-cnt { background:#e2e8f0; color:#475569; padding:.1rem .45rem; border-radius:10px; font-size:.75rem; margin-left:auto; }
        .accion-icon { background:transparent; border:none; padding:.1rem .3rem; cursor:pointer; opacity:.6; color:inherit; }
        .accion-icon:hover { opacity:1; }
    </style>
</head>
<body>
    <header class="header-lago">
        <div class="header-content">
            <a href="/dashboard.html" class="header-logo"><i class="bi bi-arrow-left"></i> Categorías</a>
        </div>
    </header>
    <div class="container-fluid mt-3">
        <div class="row g-3">
            <div class="col-md-5 col-lg-4">
                <div class="col-panel">
                    <div class="col-header d-flex align-items-center gap-2">
                        <i class="bi bi-folder-fill text-primary"></i>
                        <strong>Categorías</strong>
                        <span id="contCategorias" class="badge-cnt"></span>
                        <button class="btn btn-sm btn-primary ms-auto" onclick="abrirNuevaCategoria()"><i class="bi bi-plus"></i> Nueva</button>
                    </div>
                    <div class="p-2">
                        <input type="search" id="buscarCat" class="form-control form-control-sm" placeholder="Buscar...">
                    </div>
                    <div id="listaCategorias" style="max-height:70vh; overflow-y:auto;"></div>
                </div>
            </div>
            <div class="col-md-7 col-lg-8">
                <div class="col-panel">
                    <div class="col-header d-flex align-items-center gap-2">
                        <i class="bi bi-folder2-open text-success"></i>
                        <strong id="tituloSubcat">Seleccioná una categoría</strong>
                        <span id="contSubcat" class="badge-cnt"></span>
                        <button id="btnNuevaSubcat" class="btn btn-sm btn-success ms-auto" onclick="abrirNuevaSubcategoria()" disabled><i class="bi bi-plus"></i> Nueva subcategoría</button>
                    </div>
                    <div id="listaSubcategorias" style="max-height:70vh; overflow-y:auto;">
                        <div class="text-muted text-center py-5">Elegí una categoría a la izquierda</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCat" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalCatTitulo"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" id="modalCatNombre">
          <input type="hidden" id="modalCatId"><input type="hidden" id="modalCatPadre">
          <div id="modalCatError" class="text-danger small mt-2"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" onclick="guardarCategoria()">Guardar</button></div>
      </div></div>
    </div>

    <div class="modal fade" id="modalEliminar" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle"></i> Eliminar</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <p>Vas a eliminar: <strong id="elimNombre"></strong></p>
          <div id="elimConProductos" style="display:none">
            <p class="text-warning">Hay <strong id="elimCant"></strong> producto(s) acá. ¿Qué hacemos?</p>
            <div class="form-check"><input class="form-check-input" type="radio" name="elimOpc" id="elimSinCat" value="null" checked><label class="form-check-label" for="elimSinCat">Dejarlos sin categoría</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="elimOpc" id="elimMover" value="mover"><label class="form-check-label" for="elimMover">Moverlos a:</label>
              <select class="form-select form-select-sm mt-2" id="elimDestino"></select></div>
          </div>
          <div id="elimSinProductos" style="display:none" class="text-success">Sin productos. Lista para eliminar.</div>
          <input type="hidden" id="elimId">
          <div id="elimError" class="text-danger small mt-2"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger" onclick="confirmarEliminar()">Eliminar</button></div>
      </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/categorias.js"></script>
</body>
</html>
