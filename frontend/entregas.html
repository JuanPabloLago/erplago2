<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/erp-lago-styles.css" rel="stylesheet">
    <style>
        .cursor-pointer { cursor: pointer; }
        .cursor-pointer:hover { background-color: rgba(0,0,0,0.04); }
        tr[data-id]:focus { outline: 2px solid var(--bs-primary); outline-offset: -2px; }
        .stat-card { border-left: 4px solid #1b8a4a; }
        @media print {
            .no-print { display: none !important; }
            .navbar { display: none !important; }
            body { padding: 0; }
        }
    </style>
</head>
<body>
    <!-- Auth y config se cargan primero (igual que remitos.html) -->
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>

    <!-- Navbar LAGO estándar -->
    <nav class="navbar navbar-dark no-print" style="background: linear-gradient(135deg, #1b8a4a 0%, #145a32 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-box-seam"></i> Entregas
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-text text-white-50 small d-none d-md-inline" id="userInfo"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-3">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3 no-print">
            <div>
                <h4 class="mb-0"><i class="bi bi-box-seam"></i> Productos entregados</h4>
                <small class="text-muted">Qué salió, a quién y cuándo — sobre remitos no anulados</small>
            </div>
            <div class="d-flex gap-2">
                <div class="btn-group btn-group-sm" role="group" aria-label="Vista">
                    <input type="radio" class="btn-check" name="modoVista" id="modoDetalle" value="detalle" checked>
                    <label class="btn btn-outline-success" for="modoDetalle"><i class="bi bi-list-ul"></i> Detalle</label>
                    <input type="radio" class="btn-check" name="modoVista" id="modoAgregado" value="agregado">
                    <label class="btn btn-outline-success" for="modoAgregado"><i class="bi bi-bar-chart"></i> Agregado</label>
                </div>
                <button id="btnExportar" class="btn btn-outline-success btn-sm" title="Exportar CSV (F8)">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exportar
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div id="statsContainer" class="row g-2 mb-3 no-print"></div>

        <!-- Navegación rápida por día -->
        <div class="d-flex align-items-center gap-2 mb-2 no-print">
            <button id="btnDiaAnterior" class="btn btn-outline-secondary btn-sm" title="Día anterior (−1)">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button id="btnHoy" class="btn btn-outline-success btn-sm" title="Volver a hoy">
                <i class="bi bi-calendar-day"></i> Hoy
            </button>
            <button id="btnDiaSiguiente" class="btn btn-outline-secondary btn-sm" title="Día siguiente (+1)">
                <i class="bi bi-chevron-right"></i>
            </button>
            <span id="rangoLabel" class="small text-muted ms-2"></span>
        </div>

        <!-- Filtros -->
        <div class="card mb-3 no-print">
            <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Desde</label>
                        <input type="date" id="filtroDesde" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Hasta</label>
                        <input type="date" id="filtroHasta" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Estado</label>
                        <select id="filtroEstado" class="form-select form-select-sm">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Depósito</label>
                        <select id="filtroDeposito" class="form-select form-select-sm">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Chofer</label>
                        <select id="filtroChofer" class="form-select form-select-sm">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-0">Producto</label>
                        <input type="text" id="filtroProducto" class="form-control form-control-sm" placeholder="Descripción...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-0">Cliente</label>
                        <input type="text" id="filtroCliente" class="form-control form-control-sm" placeholder="Razón social...">
                    </div>
                    <div class="col-md-9 d-flex gap-1 justify-content-end">
                        <button id="btnBuscar" class="btn btn-primary btn-sm"><i class="bi bi-search"></i> Buscar</button>
                        <button id="btnLimpiar" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i> Limpiar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chips de filtros activos -->
        <div id="chipsFiltros" class="d-flex flex-wrap gap-1 mb-2 no-print"></div>

        <!-- Tabla -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0" id="tablaEntregas">
                    <thead class="table-dark" id="tablaEntregasHead"></thead>
                    <tbody id="tablaEntregasBody"></tbody>
                </table>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center py-2 no-print">
                <span id="infoResultados" class="small text-muted">-</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/entregas.js"></script>
    <!-- Modal: detalle de remito (in-place, no cambia de página) -->
    <div class="modal fade" id="modalRemito" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2" style="background: linear-gradient(135deg, #1b8a4a 0%, #145a32 100%);">
                    <h5 class="modal-title text-white"><i class="bi bi-receipt"></i> Detalle de Remito</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modalRemitoContenido"></div>
                <div class="modal-footer py-1">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                        <i class="bi bi-arrow-left"></i> Volver a Entregas
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
