<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Caja - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .caja-cerrada { background: #f8d7da; border-left: 5px solid #dc3545; }
        .caja-abierta { background: #d4edda; border-left: 5px solid #28a745; }
    </style>
</head>
<body>
    <script src="js/connection-indicator.js"></script>
    
    <nav class="navbar navbar-dark gradient-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-arrow-left-circle"></i> ERP LAGO
            </a>
            <span class="navbar-text text-white">
                <i class="bi bi-cash-stack"></i> Gestión de Caja
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Estado de la Caja -->
            <div class="col-md-8">
                <div class="card shadow-sm" id="estadoCaja">
                    <div class="card-body text-center">
                        <div class="spinner-border"></div>
                        <p>Cargando estado de caja...</p>
                    </div>
                </div>
            </div>

            <!-- Panel de Control -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <i class="bi bi-gear"></i> Acciones
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success w-100 mb-2" id="btnAbrirCaja" onclick="abrirCaja()" disabled>
                            <i class="bi bi-unlock"></i> Abrir Caja
                        </button>
                        <button class="btn btn-danger w-100" id="btnCerrarCaja" onclick="cerrarCaja()" disabled>
                            <i class="bi bi-lock"></i> Cerrar Caja
                        </button>
                    </div>
                </div>

                <!-- Resumen del Día -->
                <div class="card shadow-sm mt-3">
                    <div class="card-header bg-info text-white">
                        <i class="bi bi-graph-up"></i> Resumen del Día
                    </div>
                    <div class="card-body" id="resumenDia">
                        <p class="text-muted">Abre la caja para ver el resumen</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Abrir Caja -->
    <div class="modal fade" id="modalAbrirCaja" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Abrir Caja</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Monto Inicial ARS</label>
                        <input type="number" class="form-control" id="montoInicialARS" value="0" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monto Inicial USD</label>
                        <input type="number" class="form-control" id="montoInicialUSD" value="0" step="0.01">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="confirmarApertura()">
                        <i class="bi bi-unlock"></i> Abrir Caja
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cerrar Caja -->
    <div class="modal fade" id="modalCerrarCaja" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Cerrar Caja (Arqueo)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info">
                        Cuenta el efectivo físico en caja
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Efectivo Real ARS</label>
                        <input type="number" class="form-control" id="arqueoARS" value="0" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Efectivo Real USD</label>
                        <input type="number" class="form-control" id="arqueoUSD" value="0" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observacionesCierre" rows="2"></textarea>
                    </div>
                    <div id="diferencias" class="alert alert-warning" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" onclick="confirmarCierre()">
                        <i class="bi bi-lock"></i> Cerrar Caja
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://72.60.148.18:3000/api';
        let turnoActual = null;
        let modalAbrir, modalCerrar;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            modalAbrir = new bootstrap.Modal(document.getElementById('modalAbrirCaja'));
            modalCerrar = new bootstrap.Modal(document.getElementById('modalCerrarCaja'));

            cargarEstadoCaja();
            setInterval(cargarEstadoCaja, 30000); // actualizar cada 30 seg
        });

        async function cargarEstadoCaja() {
            try {
                // Asumimos que hay una caja ID 1 por defecto
                const response = await fetch(`${API_URL}/cajas/turno-actual/1`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });

                const data = await response.json();

                if (data.turno_abierto) {
                    turnoActual = data.turno;
                    mostrarCajaAbierta(turnoActual);
                    document.getElementById('btnAbrirCaja').disabled = true;
                    document.getElementById('btnCerrarCaja').disabled = false;
                } else {
                    turnoActual = null;
                    mostrarCajaCerrada();
                    document.getElementById('btnAbrirCaja').disabled = false;
                    document.getElementById('btnCerrarCaja').disabled = true;
                }

            } catch (error) {
                console.error('Error:', error);
            }
        }

        function mostrarCajaAbierta(turno) {
            const html = `
                <div class="card-header caja-abierta">
                    <h4><i class="bi bi-unlock"></i> CAJA ABIERTA</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Turno:</strong> #${turno.id_turno}</p>
                            <p><strong>Apertura:</strong> ${new Date(turno.fecha_apertura).toLocaleString('es-AR')}</p>
                            <p><strong>Usuario:</strong> ${turno.usuario_apertura}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Inicial ARS:</strong> $${parseFloat(turno.monto_inicial_ars).toFixed(2)}</p>
                            <p><strong>Inicial USD:</strong> $${parseFloat(turno.monto_inicial_usd).toFixed(2)}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Movimientos ARS</h5>
                            <p>Ingresos: <span class="text-success">$${parseFloat(turno.ingresos_efectivo_ars || 0).toFixed(2)}</span></p>
                            <p>Egresos: <span class="text-danger">$${parseFloat(turno.egresos_efectivo_ars || 0).toFixed(2)}</span></p>
                            <h6>Teórico: $${(parseFloat(turno.monto_inicial_ars) + parseFloat(turno.ingresos_efectivo_ars || 0) - parseFloat(turno.egresos_efectivo_ars || 0)).toFixed(2)}</h6>
                        </div>
                        <div class="col-md-6">
                            <h5>Movimientos USD</h5>
                            <p>Ingresos: <span class="text-success">$${parseFloat(turno.ingresos_efectivo_usd || 0).toFixed(2)}</span></p>
                            <p>Egresos: <span class="text-danger">$${parseFloat(turno.egresos_efectivo_usd || 0).toFixed(2)}</span></p>
                            <h6>Teórico: $${(parseFloat(turno.monto_inicial_usd) + parseFloat(turno.ingresos_efectivo_usd || 0) - parseFloat(turno.egresos_efectivo_usd || 0)).toFixed(2)}</h6>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('estadoCaja').innerHTML = html;
        }

        function mostrarCajaCerrada() {
            const html = `
                <div class="card-header caja-cerrada">
                    <h4><i class="bi bi-lock"></i> CAJA CERRADA</h4>
                </div>
                <div class="card-body text-center">
                    <p class="text-muted">No hay un turno de caja abierto</p>
                    <button class="btn btn-success" onclick="abrirCaja()">
                        <i class="bi bi-unlock"></i> Abrir Caja
                    </button>
                </div>
            `;
            document.getElementById('estadoCaja').innerHTML = html;
        }

        function abrirCaja() {
            modalAbrir.show();
        }

        async function confirmarApertura() {
            const montoARS = parseFloat(document.getElementById('montoInicialARS').value) || 0;
            const montoUSD = parseFloat(document.getElementById('montoInicialUSD').value) || 0;

            try {
                const response = await fetch(`${API_URL}/cajas/abrir`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        id_caja: 1,
                        monto_inicial_ars: montoARS,
                        monto_inicial_usd: montoUSD
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('¡Caja abierta exitosamente!');
                    modalAbrir.hide();
                    cargarEstadoCaja();
                } else {
                    alert(result.error || 'Error al abrir caja');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Error al abrir caja');
            }
        }

        function cerrarCaja() {
            if (!turnoActual) {
                alert('No hay caja abierta');
                return;
            }
            modalCerrar.show();
        }

        async function confirmarCierre() {
            const arqueoARS = parseFloat(document.getElementById('arqueoARS').value) || 0;
            const arqueoUSD = parseFloat(document.getElementById('arqueoUSD').value) || 0;
            const observaciones = document.getElementById('observacionesCierre').value;

            try {
                const response = await fetch(`${API_URL}/cajas/cerrar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        id_turno: turnoActual.id_turno,
                        arqueo_efectivo_ars: arqueoARS,
                        arqueo_efectivo_usd: arqueoUSD,
                        observaciones: observaciones
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(`Caja cerrada.\nDiferencia ARS: $${result.diferencia_ars}\nDiferencia USD: $${result.diferencia_usd}`);
                    modalCerrar.hide();
                    cargarEstadoCaja();
                } else {
                    alert(result.error || 'Error al cerrar caja');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Error al cerrar caja');
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
