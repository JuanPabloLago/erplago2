<!DOCTYPE html>
<html lang="es">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - ERP LAGO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/erp-lago-styles.css">
    <style>
        .btn-reporte {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 16px; border-radius: 10px; min-width: 120px;
            font-size: 0.8rem; transition: all 0.2s;
        }
        .btn-reporte i { font-size: 1.5rem; }
        .btn-reporte.active { box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .filtro-grupo { min-width: 140px; }
        .chart-box { height: 280px; }
    </style>
</head>
<body>
    <script src="js/connection-indicator.js"></script>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark sticky-top" style="background: linear-gradient(135deg, #1e293b, #334155);">
        <div class="container-fluid">
            <span class="navbar-brand mb-0"><i class="bi bi-bar-chart-line"></i> Reportes</span>
            <a href="dashboard.html" class="btn btn-sm btn-outline-light"><i class="bi bi-house"></i> Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid py-3">

        <!-- SELECTOR DE REPORTE -->
        <div class="d-flex flex-wrap gap-2 mb-3" id="botonesReporte">
            <!-- Se llena dinámicamente -->
        </div>

        <!-- FILTROS -->
        <div id="panelFiltros" style="display:none">
            <div class="card shadow-sm mb-3">
                <div class="card-body py-2">
                    <div class="d-flex flex-wrap gap-2 align-items-end">

                        <!-- Fechas -->
                        <div id="grupoFechas" class="filtro-grupo">
                            <label class="form-label mb-0 small">Desde</label>
                            <input type="date" id="filtroDesde" class="form-control form-control-sm">
                        </div>
                        <div id="grupoFechasHasta" class="filtro-grupo">
                            <label class="form-label mb-0 small">Hasta</label>
                            <input type="date" id="filtroHasta" class="form-control form-control-sm">
                        </div>

                        <!-- Vendedor -->
                        <div id="grupoVendedor" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">Vendedor</label>
                            <select id="filtroVendedor" class="form-select form-select-sm"></select>
                        </div>

                        <!-- Forma de pago -->
                        <div id="grupoFormaPago" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">Forma Pago</label>
                            <select id="filtroFormaPago" class="form-select form-select-sm"></select>
                        </div>

                        <!-- Orden (ranking) -->
                        <div id="grupoOrden" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">Ordenar por</label>
                            <select id="filtroOrden" class="form-select form-select-sm">
                                <option value="cantidad">Cantidad</option>
                                <option value="monto">Monto</option>
                            </select>
                        </div>

                        <!-- Categoría (stock) -->
                        <div id="grupoCategoria" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">Categoría</label>
                            <select id="filtroCategoria" class="form-select form-select-sm"></select>
                        </div>
                        <!-- Bloque 7.3a: subcategoria espejo de categoria (mismo catalogo plano) -->
                        <div id="grupoSubcategoria" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">Subcategor&iacute;a</label>
                            <select id="filtroSubcategoria" class="form-select form-select-sm"></select>
                        </div>

                        <!-- Solo con stock -->
                        <div id="grupoConStock" class="filtro-grupo" style="display:none">
                            <label class="form-label mb-0 small">&nbsp;</label>
                            <div class="form-check">
                                <input type="checkbox" id="filtroConStock" class="form-check-input" checked>
                                <label class="form-check-label small" for="filtroConStock">Solo con stock</label>
                            </div>
                        </div>

                        <!-- Botón generar -->
                        <div class="filtro-grupo">
                            <label class="form-label mb-0 small">&nbsp;</label>
                            <button id="btnGenerar" class="btn btn-primary btn-sm w-100" onclick="ejecutarReporte()">
                                <i class="bi bi-play-fill"></i> Generar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RESULTADOS -->
        <div id="panelResultados" style="display:none">

            <!-- Header resultados -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0" id="tituloReporte"></h5>
                <div class="d-flex gap-2 align-items-center">
                    <small class="text-muted" id="contadorResultados"></small>
                    <button class="btn btn-sm btn-outline-success" onclick="exportarCSV()">
                        <i class="bi bi-file-earmark-spreadsheet"></i> CSV
                    </button>
                </div>
            </div>

            <!-- Gráfico -->
            <div id="chartContainer" style="display:none" class="mb-3">
                <div class="card shadow-sm">
                    <div class="card-body p-2">
                        <div class="chart-box"><canvas id="chartReporte"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive" id="tablaResultados" style="max-height: 500px; overflow-y: auto;">
                        <!-- Se llena dinámicamente -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/reportes.js"></script>
    <script src="js/config-panel.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
